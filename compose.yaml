
services:
  kantin-one:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: kantin-one-app

    restart: unless-stopped

    ports:
      - "192.168.100.75:8081:80"

    working_dir: /var/www/html

    volumes:
      - ./src:/var/www/html

    networks:
      - kantin-network

  redis:
    image: redis:7.4-alpine
    container_name: kantin-one-redis
    restart: unless-stopped

    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru

    mem_limit: 128m

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - kantin-network

networks:
  kantin-network:
    external: true
    name: dasw_backend
